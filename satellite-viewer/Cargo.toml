[package]
name = "satellite-viewer"
version = "0.1.0"
edition = "2021"
description = "Cross-platform satellite image viewer with NEXRAD weather radar overlay"

[[bin]]
name = "satellite-viewer"
path = "src/main.rs"

[lib]
name = "satellite_viewer"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# ── GPU / Windowing ────────────────────────────────────────────────────────────
# Direct wgpu + winit instead of eframe — gives us full control over the
# render pipeline, shaders, and draw order.
wgpu = "27"
winit = "0.30"

# ── egui UI layer (on top of our custom renderer) ─────────────────────────────
egui          = "0.33"
egui_extras   = { version = "0.33", features = ["image"] }
egui-wgpu     = "0.33"   # egui → wgpu render pass integration
egui-winit    = "0.33"   # egui ← winit event translation

# ── Vertex data helpers ────────────────────────────────────────────────────────
bytemuck = { version = "1", features = ["derive"] }

# ── Async init helper (block_on for wgpu adapter/device negotiation) ──────────
pollster = "0.4"

# ── Networking ─────────────────────────────────────────────────────────────────
# ureq is a synchronous HTTP client with rustls built in — no tokio required.
# HTTP requests run on worker threads in our own thread pool (src/executor.rs).
ureq = { version = "2", features = ["json"] }

# ── Serialization ──────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Image decoding ─────────────────────────────────────────────────────────────
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# ── Date / Time ────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Utilities ──────────────────────────────────────────────────────────────────
log    = "0.4"
anyhow = "1"

[target.'cfg(not(target_os = "ios"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "ios")'.dependencies]
# (add ios-specific deps here)

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
